{% extends "layout.html" %}
{% block title %}{{ 'Edit' if tax else 'Add' }} Tax · {{ vehicle.vehicle_number }}{% endblock %}
{% block page_title %}{{ 'Edit' if tax else 'Add' }} Tax Record · {{ vehicle.vehicle_number }}{% endblock %}

{% block content %}
<form method="POST" class="form-card">
  <div class="form-grid">
    <div class="form-group">
      <label>Tax Mode</label>
      <select name="tax_mode" class="form-select">
        <option value="">Select mode</option>
        {% for m in ['Quarterly (Q)', 'Half-Yearly (HY)', 'Yearly (Y)', 'One-Time (LT)', 'Lifetime (LTT)'] %}
        <option value="{{ m }}" {{ 'selected' if tax and tax.tax_mode == m }}>{{ m }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Period From</label>
      <input type="date" name="latest_tax_from" class="form-control"
             value="{{ tax.latest_tax_from.strftime('%Y-%m-%d') if tax and tax.latest_tax_from else '' }}">
    </div>
    <div class="form-group">
      <label>Period Upto</label>
      <input type="date" name="latest_tax_upto" class="form-control"
             value="{{ tax.latest_tax_upto.strftime('%Y-%m-%d') if tax and tax.latest_tax_upto else '' }}">
    </div>
    <div class="form-group">
      <label>Tax Amount</label>
      <input type="number" step="0.01" name="tax_amount" class="form-control"
             value="{{ tax.tax_amount if tax else '' }}">
    </div>
    <div class="form-group">
      <label>Penalty</label>
      <input type="number" step="0.01" name="penalty" class="form-control"
             value="{{ tax.penalty if tax else '' }}">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> {{ 'Update' if tax else 'Save' }}</button>
    <a href="{{ url_for('vehicle_tax', vehicle_id=vehicle.id) }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
